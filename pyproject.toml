[project]
name = "rag-streamlit-hf-ollama"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "einops>=0.8",
    "chromadb>=1.5.9",
    "langchain-core>=0.3",
    "langchain>=1.2.17",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=0.3",
    "pypdf>=6.10.2",
    "sentence-transformers>=5.4.1",
    "langchain-huggingface>=1.2.2",
    "streamlit>=1.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Upstream Chroma telemetry: asyncio.iscoroutinefunction deprecation (Python 3.16+)
    "ignore::DeprecationWarning:chromadb.telemetry",
    # LangChain runnables (Python 3.14+): same asyncio helper deprecation
    "ignore::DeprecationWarning:langchain_core.runnables.utils",
]
